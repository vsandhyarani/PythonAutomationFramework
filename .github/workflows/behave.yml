name: Behave Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install behave selenium allure-behave webdriver-manager

      - name: Run Behave Tests
        run: |
          behave -f allure_behave.formatter:AllureFormatter -o allure-results

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34.1.tgz

      - name: Generate HTML Report
        run: |
          ./allure-2.34.1/bin/allure generate allure-results -o allure-report --clean

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report